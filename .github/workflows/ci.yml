name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # Fails when the committed lib/ no longer matches src/, then runs the
      # request-building suite and the client-wiring suite.
      - run: npm test

      # DSH-specific: lib/client.js and cordis.patch.yml both fail silently
      # when they are missing from the tarball.
      - run: npm run check:pack

  quality:
    name: release quality and isolated tarball install (node 24, DSH ${{ matrix.dsh }})
    # Playwright 1.59.1 不支持 Ubuntu 26.04，避免 latest 镜像升级破坏浏览器安装。
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2', '0.2.1-rc.3']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Keep the real DSH runtime out of the repository and out of any user
      # profile. The host harness creates a random DSH_HOME for each test.
      - name: Install pinned DSH CLI in runner temp
        shell: bash
        run: |
          set -euo pipefail
          cli_root="$(mktemp -d "$RUNNER_TEMP/dsh-cli-XXXXXX")"
          npm install --prefix "$cli_root" --package-lock=false --no-save --registry=https://registry.npmjs.org "@deepseek-ai/dsh@${{ matrix.dsh }}"
          echo "DSH_TEST_CLI=$cli_root/node_modules/@deepseek-ai/dsh/lib/bin.js" >> "$GITHUB_ENV"
          echo "DSH_TEST_VERSION=${{ matrix.dsh }}" >> "$GITHUB_ENV"

      - run: npm run quality
